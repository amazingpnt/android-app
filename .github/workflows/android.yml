name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            cmake \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtinfo5 \
            make \
            pkg-config \
            zlib1g-dev \
            unzip \
            zip \
            wget \
            curl

      - name: Install Buildozer
        run: python -m pip install --upgrade buildozer "Cython==0.29.33"

      - name: Clean stale Buildozer cache
        run: rm -rf ~/.buildozer .buildozer

      - name: Install Android SDK/NDK/build-tools
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          mkdir -p $ANDROID_SDK_ROOT

          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
          sdkmanager --update

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minimal-kivy-app-debug-apk
          path: bin/*.apk
          if-no-files-found: error