name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            cmake \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtinfo5 \
            make \
            pkg-config \
            zlib1g-dev \
            unzip \
            zip

      - name: Install Buildozer
        run: python -m pip install --upgrade buildozer "Cython==0.29.33"

      - name: Configure Buildozer SDK location
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-33

      - name: Expose SDK manager for Buildozer
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          ln -sf "$(command -v sdkmanager)" "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

      - name: Cache Android build files
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-android-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minimal-kivy-app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
