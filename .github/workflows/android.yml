name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            cmake \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtinfo5 \
            make \
            pkg-config \
            zlib1g-dev \
            unzip \
            zip

      - name: Install Buildozer
        run: python -m pip install --upgrade buildozer "Cython==0.29.33"

      - name: Configure Android SDK location
        shell: bash
        run: |
          sdk_root="$HOME/.buildozer/android/platform/android-sdk"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"

      - name: Cache Android build files
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
            ~/.cache/pip
          key: ${{ runner.os }}-android-py311-${{ hashFiles('buildozer.spec', '.github/workflows/android.yml') }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      - name: Expose SDK manager for Buildozer
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          ln -sf "$(command -v sdkmanager)" "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          test -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          test -f "$ANDROID_SDK_ROOT/platforms/android-33/android.jar"

      - name: Build debug APK
        run: buildozer android debug
